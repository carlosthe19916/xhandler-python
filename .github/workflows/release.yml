name: Release

# Runs when a release is published (release-tools' release-xhandler workflow creates it after
# syncing the core of the xhandler-rust release of the same version) and publishes to PyPI.
# The package version is the core's (src/xhandler/_core/VERSION), e.g. 6.0.0a1 for
# v6.0.0-alpha.1.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish again, e.g. v6.0.0-alpha.1"
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v7
      # A release carries the core released by xhandler-rust as the same version (release-tools
      # checks it too, before tagging)
      - run: make verify-release TAG="$TAG"
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the publisher on pypi.org names this repository, release.yml and
    # this environment
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          skip-existing: true
